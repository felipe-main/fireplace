[metadata]
name = fireplace
version = 0.1.0
description = Hearthstone engine reimplementation and simulator
author = Jerome Leclanche
author_email = jerome@leclan.ch
url = https://hearthsim.info/fireplace/
download_url = https://github.com/HearthSim/fireplace/tarball/master
classifiers =
    Development Status :: 2 - Pre-Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
    Topic :: Games/Entertainment :: Simulation

[options]
packages = find:
include_package_data = True
zip_safe = True
install_requires =
    hearthstone @ git+https://github.com/shinoi2/python-hearthstone.git#egg=hearthstone
    # Pinned per-expansion to match implemented card sets.
    # Do not skip ahead of engine support — newer cards in random pools
    # crash the engine when they reference unhandled types/mechanics.
    # 139963.1 = HS build for Patch 23.4 (Throne of the Tides mini-set).
    # 145077.1 = HS build for Patch 24.0 (Murder at Castle Nathria).
    # 150659.1 = HS build for Patch 24.4 (Maw and Disorder mini-set).
    # 158725.1 = HS build for Patch 25.0 (March of the Lich King).
    # 170824.1 = HS build for Patch 26.0 (Festival of Legends).
    # 178555.1 = HS build for Patch 26.2 (Audiopocalypse mini-set).
    # 181554.1 = HS build for Patch 27.0 (TITANS).
    # 183876.1 = HS build for Patch 27.4 (Caverns of Time / WONDERS).
    # 189017.1 = HS build for Patch 28.0 (Showdown in the Badlands).
    # 192412.1 = HS build for Patch 28.4 (Delve into Deepholm mini-set).
    # 195635.1 = HS build for Patch 29.0 (Whizbang's Workshop).
    # 203120.1 = HS build for Patch 30.0 (Perils in Paradise).
    # 213852.1 = HS build for Patch 31.2.2 (The Great Dark Beyond).
    hearthstone_data==213852.1

[options.packages.find]
exclude =
    tests
